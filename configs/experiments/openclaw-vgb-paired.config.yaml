schema_version: harbor-run.v1

run:
  output_dir: run-artifacts/openclaw-paired-gpt5.6-sol
  skills_root: ${OPENCLAW_SKILLS_ROOT}
  vgb_python: .vgb-runtime/bin/python

docker:
  delete_containers: true

task:
  agent_timeout_sec: 7200
  verifier_timeout_sec: 60
  agent_network_mode: public
  agent_allowed_hosts: []
  verifier_network_mode: public
  verifier_allowed_hosts: []

resources:
  schema_version: resource-profiles.v1
  capacity:
    source: harbor-job
    max_concurrent_trials: 2
  profiles:
    openclaw:
      cpus: 4
      memory_mb: 6144
      cpu_enforcement_policy: limit
      memory_enforcement_policy: limit

experiment:
  schema_version: experiment.v2
  experiment_id: openclaw-vgb-paired
  domain: verifier-grounded
  benchmark:
    package_lock: runtime-lock.json
    cases:
      - track: open_generation_rdkit
        task_ids:
          - rdkit_001_qed_max
      - track: open_generation_xtb
        task_ids:
          - xtb_001_gap_window
  groups:
    - id: skills_on
      label: "benchmark skills enabled"
      skills_enabled: true
      skill_allowlist_ref: configs/skills/benchmark-allowlist.v1.json
    - id: skills_off
      label: "benchmark skills disabled"
      skills_enabled: false
      skill_allowlist_ref: null
  agent:
    adapter: openclaw
    model: ${OPENCLAW_MODEL}
    thinking: xhigh
  image:
    reference: hai-openclaw-agent
    digest: sha256:2c37378bf989fc37621e8fff7acb47ae2369de64f503ecb172e2fee30f4942eb
    platform: linux/arm64
    pull_policy: if_missing
  resources:
    profile: openclaw
    config_file: embedded
  retry:
    n_attempts: 1
    max_retries: 2
